name: Deploy Website

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          PAYLOAD='{}'
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" | awk '{print "sha256="$2}')
          RESPONSE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST "https://api.tambolacircle.com/deploy-web" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD" \
            --max-time 90)
          echo "HTTP Status: $RESPONSE"
          cat /tmp/deploy_response.txt
          if [ "$RESPONSE" != "200" ]; then
            echo "Deploy failed!"
            exit 1
          fi
          echo "✓ Web deploy triggered successfully"
