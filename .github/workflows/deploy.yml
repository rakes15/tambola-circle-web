name: Deploy Website

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to server
        env:
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          sudo apt-get install -y sshpass rsync
          sshpass -p "$SSH_PASS" rsync -avz --delete --exclude=download/ \
            -e "ssh -o StrictHostKeyChecking=no" \
            dist/ root@212.38.94.27:/home/user/web/tambolacircle.com/public_html/
          echo "✓ Website deployed successfully"
