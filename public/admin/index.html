    <link rel="stylesheet" href="/css/fontawesome-all.min.css">
    <script>
      if (location.pathname === '/admin/') history.replaceState(null, '', '/admin');

      (function() {
        function isRoot(url) {
          if (url == null) return false;
          try { return new URL(String(url), location.href).pathname === '/'; } catch(e) { return false; }
        }
        function guardHard(u) { return isRoot(u) ? '/admin/login' : u; }

        // Intercept hard navigations (location.href / .assign / .replace)
        var desc = Object.getOwnPropertyDescriptor(Location.prototype, 'href');
        if (desc && desc.set) {
          var s = desc.set;
          try {
            Object.defineProperty(Location.prototype, 'href', { get: desc.get, set: function(u) { s.call(this, guardHard(u)); }, configurable: true });
          } catch(e) {}
        }
        var oa = Location.prototype.assign;
        Location.prototype.assign = function(u) { oa.call(this, guardHard(u)); };
        var or = Location.prototype.replace;
        Location.prototype.replace = function(u) { or.call(this, guardHard(u)); };

        // Intercept React Router's client-side pushState/replaceState to /
        var origPush = history.pushState;
        var origReplace = history.replaceState;
        history.pushState = function(state, title, url) {
          console.log('[admin-guard] pushState:', url);
          var dest = isRoot(url) ? '/admin/login' : url;
          if (dest !== url) console.warn('[admin-guard] redirected push to', dest);
          return origPush.call(history, state, title, dest);
        };
        history.replaceState = function(state, title, url) {
          console.log('[admin-guard] replaceState:', url);
          if (url == null || url === '') return origReplace.call(history, state, title, url);
          var dest = isRoot(url) ? '/admin/login' : url;
          if (dest !== url) console.warn('[admin-guard] redirected replace to', dest);
          return origReplace.call(history, state, title, dest);
        };
      })();
    </script>
